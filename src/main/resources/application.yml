server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:hipicon
    driver-class-name: org.h2.Driver
    username: hipicon
    password: ""

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.springframework.security: DEBUG
